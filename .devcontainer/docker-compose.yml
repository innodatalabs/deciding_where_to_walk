# The workspace and Neo4j Community Edition side by side.
# Inside the workspace, Neo4j is at bolt://neo4j:7687. From your laptop, the Neo4j Browser is at http://localhost:7474.
name: deciding-where-to-walk

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/deciding-where-to-walk:cached
    command: sleep infinity
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j-password}
      HF_HOME: /workspaces/deciding-where-to-walk/data/.hf_cache
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:2026.09.0-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j-password}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  neo4j-data:
